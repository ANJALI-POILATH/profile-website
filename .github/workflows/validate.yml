
name: HTML and CSS Validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate HTML and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: npm install --no-save --package-lock=false htmlhint stylelint stylelint-config-standard

      - name: Validate HTML files
        run: npx htmlhint "*.html" --config .htmlhintrc

      - name: Validate CSS files
        run: npx stylelint "css/**/*.css"
