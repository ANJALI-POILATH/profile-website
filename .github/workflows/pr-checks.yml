name: PR Quality Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  check-html-titles:
    name: Check HTML titles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all HTML files have title tags
        run: |
          for file in *.html; do
            if ! grep -q "<title>" "$file"; then
              echo "ERROR: $file is missing <title> tag"
              exit 1
            fi
          done
          echo "All HTML files have title tags"

  check-image-alt:
    name: Check image alt attributes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # <img> tags often span several lines, so a line-by-line grep gives
      # false alarms. This reads whole tags instead.
      - name: Check images have alt attributes
        run: |
          python3 - <<'PY'
          import glob, re, sys
          missing = []
          for path in glob.glob("*.html"):
              text = open(path, encoding="utf-8").read()
              for m in re.finditer(r"<img\b[^>]*>", text, re.I | re.S):
                  if not re.search(r"\balt\s*=", m.group(0), re.I):
                      line = text.count("\n", 0, m.start()) + 1
                      missing.append(f"{path}:{line}")
          if missing:
              print("ERROR: Images missing alt attributes:")
              print("\n".join(missing))
              sys.exit(1)
          print("All images have alt attributes")
          PY

  check-no-console-log:
    name: Check for console.log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log in JS
        run: |
          if grep -rn "console.log" js/*.js; then
            echo "WARNING: Remove console.log before merging"
            exit 1
          fi
          echo "No console.log found"

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [check-html-titles, check-image-alt, check-no-console-log]
    steps:
      - name: All checks passed
        run: echo "All PR checks passed! Ready for review."
